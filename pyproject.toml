[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generative-calculus"
version = "2.0.0"
description = "Reproducible resource-scaled embodied operational envelope benchmarks for Generative Calculus"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mohammad Amir Khusru Akhtar"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scipy>=1.10", "gradio>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
generative-calculus = "generative_calculus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
