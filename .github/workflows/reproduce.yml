name: Test and reproduce
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m generative_calculus.reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: generative-calculus-v2-results
          path: results/
